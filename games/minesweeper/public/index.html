<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minesweeper | GameHUB</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="/game-theme.css"></head>
<body><main class="page-shell"><header class="topbar"><a href="/" class="back-link">← Back to Library</a><span class="eyebrow">GAMEHUB / PUZZLE</span></header><section class="intro"><div><p class="eyebrow">READ THE BOARD</p><h1>Minesweeper</h1><p>Clear every safe square, flag the mines and make your best time.</p></div><button id="helpBtn" class="ghost-btn" type="button">? Controls</button></section><section class="game-card"><div class="controls"><label>Difficulty<select id="difficulty"><option value="easy">Easy · 9×9</option><option value="medium">Medium · 16×16</option><option value="hard">Hard · 30×16</option></select></label><span>Mines <b id="mines">10</b></span><span>Time <b id="time">000</b></span><span>Best <b id="best">—</b></span><button id="newBtn" class="primary-btn" type="button">New Board</button></div><div id="status" class="status">Choose a difficulty and start clearing.</div><div id="board" class="board" aria-label="Minesweeper board"></div><label class="name-label">Player name<input id="playerName" maxlength="20" placeholder="Player" autocomplete="off"></label></section><section class="help-panel" id="helpPanel" hidden><h2>Controls</h2><p>Click to reveal · Right-click or long-press to flag · R starts a new board.</p></section></main><script src="script.js"></script></body></html>
