<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rock Paper Scissors | GameHUB</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="/game-theme.css"></head>
<body><main class="page-shell"><header class="topbar"><a href="/" class="back-link">← Back to Library</a><span class="eyebrow">GAMEHUB / CLASSIC</span></header><section class="intro"><div><p class="eyebrow">BEST OF FIVE</p><h1>Rock Paper Scissors</h1><p>Choose your move, read the result and beat the computer to five.</p></div><button id="helpBtn" class="ghost-btn" type="button">? Controls</button></section><section class="game-card"><div class="scoreboard"><div><span>You</span><b id="playerScore">0</b></div><strong>VS</strong><div><span>Computer</span><b id="computerScore">0</b></div></div><p id="status" class="status">Choose your first move.</p><div class="arena"><div class="choice" id="playerChoice">✦<small>Your move</small></div><div class="versus">⚡</div><div class="choice" id="computerChoice">?</div></div><div class="choices"><button data-move="rock" type="button">✊<span>Rock</span></button><button data-move="paper" type="button">✋<span>Paper</span></button><button data-move="scissors" type="button">✌️<span>Scissors</span></button></div><label class="name-label">Player name<input id="playerName" maxlength="20" placeholder="Player" autocomplete="off"></label><button id="resetBtn" class="primary-btn" type="button">↻ New Match</button></section><section class="help-panel" id="helpPanel" hidden><h2>Controls</h2><p>Click a move or press R, P, or S. First player to five round wins takes the match.</p></section></main><script src="script.js"></script></body></html>
